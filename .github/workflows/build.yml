name: Build firmware

on:
  workflow_dispatch:
    inputs:
      profiles:
        description: "Profiles to build (space-separated names from profiles/)"
        type: string
        default: "default minimal"
      upstream:
        description: "Upstream tree: the pinned commit, or the current openwrt-25.12 tip"
        type: choice
        options: [pinned, latest]
        default: pinned
      publish:
        description: "Publish as a release on this channel"
        type: choice
        options: [testing, stable, none]
        default: testing
  schedule:
    # Daily: build and publish to "testing" when upstream has moved, or this
    # repository has commits since the newest release.
    - cron: "41 6 * * *"

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

env:
  PROFILES: ${{ inputs.profiles || 'default minimal' }}
  UPSTREAM: ${{ inputs.upstream || 'latest' }}
  PUBLISH: ${{ inputs.publish || 'testing' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      changed: ${{ steps.bump.outputs.changed }}
      commits: ${{ steps.commits.outputs.count }}
      pins: ${{ steps.plan.outputs.pins }}
      release: ${{ steps.bump.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate inputs
        run: |
          for p in $PROFILES; do
            case "$p" in *[!A-Za-z0-9._-]*) echo "::error::bad profile name: $p"; exit 1 ;; esac
            [ -f "profiles/$p.packages" ] || { echo "::error::no profiles/$p.packages"; exit 1; }
          done

      - name: Look for a new upstream commit
        id: bump
        if: env.UPSTREAM == 'latest'
        run: |
          scripts/bump-upstream.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Look for commits since the newest release
        id: commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh release list --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName // empty')
          if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev" >/dev/null; then
            n=$(git log --format=%an "$prev..HEAD" | grep -cvxF 'github-actions[bot]' || true)
          else
            n=1
          fi
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "Commits since ${prev:-the first release}: $n" >> "$GITHUB_STEP_SUMMARY"

      - name: Decide
        id: plan
        env:
          CHANGED: ${{ steps.bump.outputs.changed }}
          COMMITS: ${{ steps.commits.outputs.count }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pins=$(cat upstream/* | sha256sum | cut -c1-12)
          echo "pins=$pins" >> "$GITHUB_OUTPUT"
          known=
          if [ "$CHANGED" = true ]; then
            known=$(gh issue list --state open --label upstream-held --search "$pins in:body" \
              --json number --jq '.[0].number // empty' 2>/dev/null || true)
          fi
          if [ "${{ github.event_name }}" = schedule ] && [ "$CHANGED" != true ] && [ "$COMMITS" = 0 ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new upstream or here; not building." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ github.event_name }}" = schedule ] && [ -n "$known" ] && [ "$COMMITS" = 0 ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "This upstream is known not to build (issue #$known) and nothing is new here; not building." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=r8000-openwrt-$(date -u +%Y.%m.%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Hand the pins to the build
        if: steps.plan.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-pins
          path: upstream/
          retention-days: 7

  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write
      issues: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bzip2 g++ gawk gcc git libncurses-dev make rsync file unzip wget zstd \
            python3 device-tree-compiler squashfs-tools binutils

      - name: Check out
        uses: actions/checkout@v4

      - name: Use the planned pins
        uses: actions/download-artifact@v4
        with:
          name: upstream-pins
          path: upstream/

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: build/dl
          key: dl-${{ hashFiles('upstream/*', 'configs/*', 'profiles/*') }}-${{ github.run_id }}
          restore-keys: |
            dl-${{ hashFiles('upstream/*', 'configs/*', 'profiles/*') }}-
            dl-

      - name: Build
        id: build
        env:
          CHANGED: ${{ needs.plan.outputs.changed }}
          COMMITS: ${{ needs.plan.outputs.commits }}
        run: |
          args=()
          for p in $PROFILES; do args+=(--profile "$p"); done
          set +e
          scripts/build.sh -j "$(nproc)" "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/build.log"
          status=${PIPESTATUS[0]}
          set -e
          [ "$status" != 0 ] || exit 0

          [ "$CHANGED" = true ] || exit "$status"

          echo "held=true" >> "$GITHUB_OUTPUT"
          tail -n 80 "$RUNNER_TEMP/build.log" > "$RUNNER_TEMP/held.log"
          echo "::warning::The newer upstream does not build with this repository; holding it back"
          git checkout HEAD -- upstream/ patches/
          if [ "$COMMITS" = 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Upstream held back and nothing new here: not publishing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Upstream held back: building the pinned upstream for the commits here." >> "$GITHUB_STEP_SUMMARY"
          rm -rf build/openwrt out
          scripts/build.sh -j "$(nproc)" "${args[@]}"

      - name: Collect release assets
        if: steps.build.outputs.skip != 'true'
        run: |
          mkdir -p release
          for p in $PROFILES; do
            for f in out/"$p"/*netgear_r8000*; do
              name=$(basename "$f")
              cp "$f" "release/${name/netgear_r8000/netgear_r8000-$p}"
            done
            cp "out/$p/config.full" "release/config-$p.txt"
            cp "out/$p/build-info" "release/build-info-$p.txt"
          done
          (cd release && sha256sum -- * | sort -k2) > sha256sums
          mv sha256sums release/
          cat release/sha256sums

      - name: Upload images
        if: steps.build.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: r8000-openwrt-${{ github.sha }}
          path: release/
          if-no-files-found: error

      - name: Create release
        if: env.PUBLISH != 'none' && steps.build.outputs.skip != 'true'
        env:
          HELD: ${{ steps.build.outputs.held }}
          HELD_RELEASE: ${{ needs.plan.outputs.release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          . upstream/openwrt.conf
          {
            echo "OpenWrt for the Netgear R8000, built from ${GITHUB_SHA::7}."
            echo
            echo "- Channel: **$PUBLISH**"
            echo "- Upstream: [\`openwrt/openwrt\`](https://github.com/openwrt/openwrt) branch \`$OPENWRT_BRANCH\` @ [\`${OPENWRT_COMMIT::12}\`](https://github.com/openwrt/openwrt/commit/$OPENWRT_COMMIT)"
            echo "- Profiles: $PROFILES (see \`profiles/\`)"
            if [ "$HELD" = true ]; then
              echo "- Held back: the newer upstream does not build with this repository yet; see the open \`upstream-held\` issue."
            fi
            echo
            echo "| File | Use |"
            echo "|---|---|"
            echo "| \`*-<profile>*.chk\` | flash from the stock Netgear firmware, or sysupgrade/factory-reflash from OpenWrt (see the README) |"
            echo
            echo "**This release is not cryptographically signed.** There is no A/B or trial-boot firmware-update mechanism on this hardware (see the README); verify \`sha256sums\` against what you downloaded before flashing, same as any OpenWrt release."
            echo
            echo "Read the README before flashing: hardware-acceleration reality (no PPE/NSS-equivalent on this SoC), what is and is not verified on real hardware, the CTF/FA investigation (docs/ctf-fa.md), the overclock investigation (docs/overclock.md), and UniFi adoption (docs/unifi-adoption.md)."
            echo
            echo '```'
            cat release/sha256sums
            echo '```'
          } > notes.md
          channel=(--prerelease)
          [ "$PUBLISH" = stable ] && channel=(--latest)
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "R8000 OpenWrt $TAG" \
            "${channel[@]}" \
            --notes-file notes.md

      - name: Record the new pins
        if: needs.plan.outputs.changed == 'true' && steps.build.outputs.held != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . upstream/openwrt.conf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream/ patches/
          merged=
          git diff --cached --quiet -- patches/ ||
            merged="The patches in patches/ did not apply as they were and were merged three-way onto the new upstream."
          git commit -m "upstream: ${OPENWRT_COMMIT::12}" -m "Built and published as $TAG." ${merged:+-m "$merged"}
          for i in 1 2 3; do
            if git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              for n in $(gh issue list --state open --label upstream-held --json number --jq '.[].number'); do
                gh issue close "$n" --comment "Superseded: $TAG was built with a newer upstream." || true
              done
              exit 0
            fi
            sleep 5
          done
          echo "::error::could not push the new pins"; exit 1

      - name: Report a held-back upstream
        if: always() && steps.build.outputs.held == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PINS: ${{ needs.plan.outputs.pins }}
        run: |
          gh label create upstream-held --color d93f0b --force \
            --description "A newer upstream that does not build with this repository" >/dev/null
          {
            echo "The scheduled build could not use the newer upstream; it was held back and the pinned upstream kept."
            echo
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Pins: \`$PINS\` (the same upstream is not tried again by a scheduled run while this issue is open)"
            echo
            echo "Fix: move the pins with \`scripts/bump-upstream.sh\`, rebase \`patches/\` onto the new tree, and push; the next build closes this issue."
            echo
            echo "<details><summary>End of the build log</summary>"
            echo
            echo '\`\`\`'
            cat "$RUNNER_TEMP/held.log"
            echo '\`\`\`'
            echo "</details>"
          } > held.md
          n=$(gh issue list --state open --label upstream-held --search "$PINS in:body" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file held.md
          else
            gh issue create --title "Upstream held back: $PINS" --label upstream-held --body-file held.md
          fi
