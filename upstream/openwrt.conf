# EXPERIMENTAL BRANCH ONLY (experimental/bcm53xx-hw-offload) - this pin is
# intentionally different from `main`. See docs/experimental-hw-offload-branch.md
# and docs/ctf-fa.md before building or trusting anything about this branch.
#
# `main` pins plain, official OpenWrt (openwrt-25.12) because bcm53xx has no
# hardware packet-offload engine in any official tree. This branch exists
# because a real, reviewed (not yet merged) Northstar flow-accelerator driver
# does - but only on an individual contributor's fork, against OpenWrt `main`,
# not against any official release branch:
#
#   openwrt/openwrt#26789 "bcm53xx: offload flows to the Northstar flow
#   accelerator" - open, 2 of 6 required reviews, targets `main`. Its branch:
#
OPENWRT_URL=https://github.com/egc112/openwrt.git
OPENWRT_BRANCH=bcm53xx-fa
OPENWRT_COMMIT=c25b1f2b53290e5358c56542bafbaf2edc748282
#
# That commit is the branch's head as of 2026-11-21 (the day before this pin
# was written) - record-checked, not blindly tracked. DO NOT run
# scripts/bump-upstream.sh on this branch without reading what changed first:
# it will happily move OPENWRT_COMMIT to whatever this fork's branch head is
# on the day you run it, which is an actively-changing, unmerged, non-release
# tree, not a maintained stable branch like openwrt-25.12. Re-pin by hand:
# read the PR's new commits, update OPENWRT_COMMIT yourself, and expect
# patches/0001-0002 (written against openwrt-25.12) and patches/0003 (this
# branch's own, written against this exact commit) to possibly need
# re-merging - scripts/build.sh's three-way merge path handles drift from the
# *previous* pin on *this* branch, not drift from `main`'s pin.
#
# Consequences of this base, beyond the FA driver itself:
# - Kernel 6.18 (patches-6.18/), not `main`'s stable-branch 6.12
#   (patches-6.12/) - a newer, less-tested-by-this-repository kernel line.
# - patches/0001 and 0002 (the 5 GHz NVRAM fix and the brcmfmac MBSS
#   fallback) have NOT been re-verified against this base. scripts/build.sh's
#   three-way-merge-on-drift path should catch an outright failure to apply,
#   but has not been run against this specific tree by this investigation -
#   treat a build from this branch as fully unverified in every respect, not
#   just for the new patches/0003.
