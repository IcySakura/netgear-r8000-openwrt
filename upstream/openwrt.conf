# OpenWrt tree the patches in patches/ apply to: official OpenWrt, branch
# openwrt-25.12. There is no third-party "NSS"-style offload fork to pin here:
# bcm53xx (the Netgear R8000's target) has no hardware packet-offload engine,
# so this build is plain upstream OpenWrt plus the patches/ and profiles/ of
# this repository. scripts/bump-upstream.sh moves OPENWRT_COMMIT to the
# branch's current tip; it does not follow GitHub Releases (openwrt-25.12 is a
# stable branch, not a release-tagged fork).
OPENWRT_URL=https://github.com/openwrt/openwrt.git
OPENWRT_BRANCH=openwrt-25.12
OPENWRT_COMMIT=b96479146011e778e634a4fb6dd27d1573aead4a
